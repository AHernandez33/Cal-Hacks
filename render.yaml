# Entire app on one HTTPS Render service. Standard plan + persistent disk are paid.
services:
  - type: web
    name: vigiloforge
    runtime: docker
    branch: feature/nine-agent-delivery
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SQLITE_DB_PATH
        value: /var/data/vigiloforge.db
      - key: VIGILO_API_TOKEN
        generateValue: true
      - key: FETCH_AGENT_SEED
        generateValue: true
      - key: FETCH_MAILBOX
        value: "false"
      - key: CREAO_API_VERSION
        value: v1
      - key: NEXT_PUBLIC_API_URL
        value: /api
    disk:
      name: vigiloforge-data
      mountPath: /var/data
      sizeGB: 1
